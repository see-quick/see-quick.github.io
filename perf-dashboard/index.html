---
layout: perf-dashboard
title: Strimzi Performance Dashboard
---

<h1>Strimzi Performance Dashboard</h1>
<div class="meta" id="meta-info">Loading...</div>

<div id="regression-section"></div>

<div class="filters">
  <button class="active" data-filter="all">All</button>
  <button data-filter="cluster-operator">Cluster Operator</button>
  <button data-filter="topic-operator">Topic Operator</button>
  <button data-filter="user-operator">User Operator</button>
  <button data-filter="connect">Connect</button>
</div>

<div class="chart-grid" id="charts"></div>

<script>
const resultsData = {{ site.data.performance.results | jsonify }};
const regressionsData = {{ site.data.performance.regressions | jsonify }};

// Validated dark-mode categorical palette (fixed slot order, never cycled).
const SERIES_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#9085e9'];
const CRITICAL = '#d03b3b';
const INK_SECONDARY = '#8b949e';
const GRID = '#21262d';

// Result keys look like "<base>-<paramName>-<value>", e.g.
// "topic-operator-scalabilityUseCase-numberOfTopics-250". Runs of a test
// with different parameter values are grouped into one multi-line chart.
const PARAM_NAMES = ['numberOfTopics', 'numberOfKafkaUsers', 'connectorCount'];
const KEY_PATTERN = new RegExp('^(.+?)-(' + PARAM_NAMES.join('|') + ')-(.+)$');

function parseKey(key) {
  const m = key.match(KEY_PATTERN);
  if (m) return { base: m[1], param: m[2], value: m[3] };
  return { base: key, param: null, value: null };
}

function shortDate(d) {
  // "2026-09-11T08:04" -> "09-11"
  return d.length >= 10 ? d.slice(5, 10) : d;
}

function fmt(v) {
  if (v === null || v === undefined) return 'n/a';
  return Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
}

function init() {
  const meta = document.getElementById('meta-info');
  if (!resultsData || !resultsData.runs || resultsData.runs.length === 0) {
    meta.textContent = 'No performance data available yet. Run your first nightly test to populate.';
    return;
  }

  const runs = resultsData.runs;
  const latest = runs[runs.length - 1];
  meta.innerHTML =
    'Last run: <strong>' + latest.date + '</strong>' +
    (latest.commitSha ? ' @ <code>' + latest.commitSha + '</code>' : '') +
    ' &middot; ' + runs.length + ' runs shown' +
    ' &middot; updated ' + (resultsData.lastUpdated || 'n/a').slice(0, 16) +
    ' &middot; <a href="https://github.com/see-quick/strimzi-perf-results" target="_blank" rel="noopener">raw data</a>';

  renderRegressions();
  renderCharts('all');
  setupFilters();
}

function renderRegressions() {
  const section = document.getElementById('regression-section');
  const regressions = (regressionsData && regressionsData.regressions) || [];

  if (regressions.length === 0) {
    section.innerHTML = '<div class="no-regressions">No active regressions detected.</div>';
    return;
  }

  let html = '<div class="regression-banner"><h2>Active Regressions (' + regressions.length + ')</h2>';
  regressions.forEach(function(r) {
    html += '<div class="regression-item">' +
      '<div class="metric-name">' + r.testName + ' / ' + r.metricName + '</div>' +
      '<div class="details">Current: ' + fmt(r.currentValue) + ' | Baseline: ' + fmt(r.baselineMean) +
      ' +/- ' + fmt(r.baselineStddev) + ' | ' + r.deviations.toFixed(2) + ' sigma</div>' +
      '</div>';
  });
  html += '</div>';
  section.innerHTML = html;
}

// Group runs into charts: one chart per (base test, metric), one line per
// parameter value. Returns [{base, param, metric, series: [{key, label, points}]}].
function buildChartGroups(runs, filter) {
  const groups = {};

  runs.forEach(function(run, runIdx) {
    Object.entries(run.results || {}).forEach(function(entry) {
      const key = entry[0];
      if (filter !== 'all' && key.indexOf(filter) === -1) return;

      const parsed = parseKey(key);
      Object.entries(entry[1]).forEach(function(mEntry) {
        const metric = mEntry[0];
        const groupId = parsed.base + '::' + metric;
        if (!groups[groupId]) {
          groups[groupId] = { base: parsed.base, param: parsed.param, metric: metric, seriesByKey: {} };
        }
        const g = groups[groupId];
        if (!g.seriesByKey[key]) {
          g.seriesByKey[key] = {
            key: key,
            paramValue: parsed.value,
            points: new Array(runs.length).fill(null)
          };
        }
        g.seriesByKey[key].points[runIdx] = mEntry[1];
      });
    });
  });

  return Object.values(groups).map(function(g) {
    const series = Object.values(g.seriesByKey);
    // Order lines by ascending parameter value so slot colors stay stable.
    series.sort(function(a, b) {
      return (parseFloat(a.paramValue) || 0) - (parseFloat(b.paramValue) || 0);
    });
    return { base: g.base, param: g.param, metric: g.metric, series: series };
  }).sort(function(a, b) {
    return (a.base + a.metric).localeCompare(b.base + b.metric);
  });
}

let liveCharts = [];

function renderCharts(filter) {
  const container = document.getElementById('charts');
  liveCharts.forEach(function(c) { c.destroy(); });
  liveCharts = [];
  container.innerHTML = '';

  const runs = resultsData.runs;
  const baselines = resultsData.baselines || {};
  const labels = runs.map(function(r) { return shortDate(r.date); });

  buildChartGroups(runs, filter).forEach(function(group) {
    const multi = group.series.length > 1;

    const card = document.createElement('div');
    card.className = 'chart-card';
    const subtitle = group.param ? ' <span class="param-name">by ' + group.param + '</span>' : '';
    card.innerHTML = '<h3>' + group.base + ' &middot; ' + group.metric + subtitle + '</h3><canvas></canvas>';
    container.appendChild(card);

    const datasets = group.series.map(function(s, i) {
      const color = SERIES_COLORS[i % SERIES_COLORS.length];
      const bl = baselines[s.key] && baselines[s.key][group.metric];

      // Flag points beyond mean + 2 sigma of that series' own baseline.
      const pointColors = s.points.map(function(v) {
        if (v !== null && bl && bl.stddev > 0 && (v - bl.mean) / bl.stddev > 2) return CRITICAL;
        return color;
      });
      const pointRadii = s.points.map(function(v, idx) {
        return pointColors[idx] === CRITICAL ? 5 : 2.5;
      });

      return {
        label: s.paramValue !== null ? group.param + '=' + s.paramValue : group.metric,
        data: s.points,
        borderColor: color,
        backgroundColor: color,
        pointBackgroundColor: pointColors,
        pointBorderColor: pointColors,
        pointRadius: pointRadii,
        borderWidth: 2,
        fill: false,
        tension: 0.25,
        spanGaps: true
      };
    });

    // Baseline band only on single-series charts; on multi-line charts each
    // series has its own baseline, so bands would clutter.
    if (!multi) {
      const s = group.series[0];
      const bl = baselines[s.key] && baselines[s.key][group.metric];
      if (bl) {
        datasets.push({
          label: 'baseline +2s',
          data: new Array(labels.length).fill(bl.mean + 2 * bl.stddev),
          borderColor: 'rgba(248, 81, 73, 0.45)',
          borderDash: [5, 5], borderWidth: 1, fill: false, pointRadius: 0
        });
        datasets.push({
          label: 'baseline -2s',
          data: new Array(labels.length).fill(Math.max(0, bl.mean - 2 * bl.stddev)),
          borderColor: 'rgba(63, 185, 80, 0.45)',
          borderDash: [5, 5], borderWidth: 1, fill: false, pointRadius: 0
        });
      }
    }

    const chart = new Chart(card.querySelector('canvas'), {
      type: 'line',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        scales: {
          y: {
            beginAtZero: false,
            ticks: { color: INK_SECONDARY, callback: function(v) { return fmt(v); } },
            grid: { color: GRID }
          },
          x: { ticks: { color: INK_SECONDARY, maxRotation: 45, autoSkip: true, maxTicksLimit: 15 }, grid: { color: GRID } }
        },
        plugins: {
          legend: {
            display: multi,
            labels: { color: '#c9d1d9', boxWidth: 12, boxHeight: 12, usePointStyle: false }
          },
          tooltip: {
            callbacks: {
              title: function(items) {
                if (!items.length) return '';
                const run = runs[items[0].dataIndex];
                return run.date + (run.commitSha ? '  @ ' + run.commitSha : '');
              },
              label: function(ctx) {
                let text = ctx.dataset.label + ': ' + fmt(ctx.parsed.y);
                if (ctx.dataset.pointBackgroundColor &&
                    ctx.dataset.pointBackgroundColor[ctx.dataIndex] === CRITICAL) {
                  text += '  (above baseline +2s)';
                }
                return text;
              }
            }
          }
        }
      }
    });
    liveCharts.push(chart);
  });
}

function setupFilters() {
  document.querySelectorAll('.filters button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.filters button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderCharts(btn.dataset.filter);
    });
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
