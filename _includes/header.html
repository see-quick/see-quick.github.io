<header>
  <a class="site-title" href="{{site.baseurl}}/">{{site.title}}</a>
  <div style="display: flex; gap: 1.25rem; align-items: center;">
    <!-- Kafka Quiz link -->
    <a href="{{site.baseurl}}/kafka-quiz/" style="cursor: pointer; font-size: 1.1em; font-weight: 600; color: var(--text-primary); text-decoration: none; transition: color 0.15s ease; white-space: nowrap; display: inline-flex; align-items: center;" title="Daily Kafka Quiz">
      <span style="margin-right: 0.25rem;">&#9889;</span>Quiz
    </a>
    <!-- Kafka Jira board link -->
    <a href="{{site.baseurl}}/kafka-jira/" style="cursor: pointer; font-size: 1.1em; font-weight: 600; color: var(--text-primary); text-decoration: none; transition: color 0.15s ease; white-space: nowrap; display: inline-flex; align-items: center;" title="Apache Kafka Jira Board">
      <svg viewBox="0 0 16 16" width="0.9em" height="0.9em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.3rem;" aria-hidden="true"><rect x="2.5" y="2" width="11" height="12.5" rx="1.5"/><path d="M5.5 6h5M5.5 9h5M5.5 12h3"/></svg>Jira
    </a>
    <!-- font switcher -->
    <span id="font-toggle" style="cursor: pointer; font-size: 1.2em; font-weight: 700; user-select: none;" title="Change font">
      Aa
    </span>
    <!-- dark/light mode -->
    <span id="dark-mode-toggle" style="cursor: pointer" title="Toggle theme">
      <svg
        stroke="currentColor"
        fill="currentColor"
        stroke-width="0"
        viewBox="0 0 16 16"
        height="1.2em"
        width="1.2em"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 13V2a6 6 0 1 1 0 12z"
        ></path>
      </svg>
    </span>
  </div>
</header>
